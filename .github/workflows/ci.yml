name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Releases are computed from the last tag, so pushes to main run one at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm check
        working-directory: web
      - run: pnpm lint
        working-directory: web

  # Works out the next version from the commits since the last release; empty when nothing
  # user-facing changed.
  version:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        run: echo "version=$(bash .github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

  image:
    needs: [test, version]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.version.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE: ${{ needs.version.outputs.next }}
    steps:
      - uses: actions/checkout@v7
      - id: build
        run: echo "version=${RELEASE:-dev-${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}},value=${{ env.RELEASE }},enable=${{ env.RELEASE != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE }},enable=${{ env.RELEASE != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE != '' }}
          flavor: latest=false
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.build.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tags the commit and publishes a GitHub release with its changelog, once the image is up.
  release:
    needs: [version, image]
    if: needs.version.outputs.next != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.next }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/changelog.sh "$VERSION" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
